# Development stack for the new architecture (docs/architecture/ARCHITECTURE.md).
# Host ports are offset (5433, 6380, 8001) so they never collide with other local services.
name: dse-analyzer
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: dse
      POSTGRES_PASSWORD: dse          # dev only; production uses secrets
      POSTGRES_DB: dse
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dse -d dse"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  migrate:                            # one-shot: replicas must never race on `alembic upgrade`
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend-env
      DSE_ENV: development
      DSE_DATABASE__URL: postgresql+asyncpg://dse:dse@db:5432/dse
      DSE_REDIS__URL: redis://redis:6379/0
      DSE_SECURITY__JWT_SECRET: ${DSE_SECURITY__JWT_SECRET:-dev-only-insecure-secret-do-not-use-in-production-0123456789}
    healthcheck: {disable: true}
    depends_on:
      db: {condition: service_healthy}
  api:                                # stateless; scale freely (ADR 0002). Replicas on host 8001, 8002
    build: ./backend
    environment: *backend-env
    ports: ["8001-8002:8000"]
    deploy: {replicas: 2}
    depends_on: &after-migrate
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  frontend:                           # Next.js; proxies /api/* to the api replicas (Docker DNS round-robins them)
    build:
      context: ./frontend
      args:
        API_ORIGIN: http://api:8000
    ports: ["3000:3000"]
    depends_on:
      api: {condition: service_healthy}
  worker:                             # exactly ONE: polls DSE, writes Redis + Postgres, publishes events
    build: ./backend
    command: ["python", "-m", "dse.worker"]
    environment: *backend-env
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "python", "-m", "dse.worker", "--check"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    depends_on: *after-migrate
volumes:
  pgdata:
