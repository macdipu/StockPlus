# Development stack for the new architecture (docs/architecture/ARCHITECTURE.md).
# Host ports are offset (5433, 6380, 8001) so they never collide with other local services.
name: dse-analyzer
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: dse
      POSTGRES_PASSWORD: dse          # dev only; production uses secrets
      POSTGRES_DB: dse
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dse -d dse"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DSE_ENV: development
      DSE_DATABASE__URL: postgresql+asyncpg://dse:dse@db:5432/dse
      DSE_REDIS__URL: redis://redis:6379/0
      DSE_SECURITY__JWT_SECRET: ${DSE_SECURITY__JWT_SECRET:-dev-only-insecure-secret}
    ports: ["8001:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  pgdata:
