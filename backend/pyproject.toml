[project]
name = "dse-analyzer"
version = "0.1.0"
description = "DSE Live Analyzer — modular monolith backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "httpx>=0.27",
  "numpy>=2.0",
  "pandas>=2.2",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8", "pytest-asyncio>=0.23", "import-linter>=2.0", "pandas-stubs>=2.2"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S", "PT", "RET", "TID"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011"]
"alembic/**" = ["N999"]
# user-facing math text keeps its typographic symbols (×, −) exactly as the legacy output had them
"src/dse/features/analysis/**" = ["RUF001", "RUF002", "RUF003"]
"src/dse/features/scanner/**" = ["RUF001", "RUF002", "RUF003"]
# legacy tests are kept verbatim (only their import lines changed) as the parity proof for the port
"src/dse/features/analysis/tests/legacy/*.py" = ["ALL"]
"src/dse/features/scanner/tests/legacy/*.py" = ["ALL"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
exclude = [
  "src/dse/features/analysis/tests/legacy/*.py",
  "src/dse/features/scanner/tests/legacy/*.py",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["dse"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "src/dse/features", "src/dse/indicators"]
markers = ["integration: needs Postgres + Redis (docker compose up -d db redis)"]

[tool.importlinter]
root_package = "dse"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core is infrastructure-only and never depends on features"
type = "forbidden"
source_modules = ["dse.core", "dse.shared_kernel"]
forbidden_modules = ["dse.features"]

[[tool.importlinter.contracts]]
# The indicator engine is a pure library: any feature may use it, it knows no feature and no framework.
name = "indicator engine is a pure library"
type = "forbidden"
source_modules = ["dse.indicators"]
forbidden_modules = ["fastapi", "sqlalchemy", "redis", "httpx", "pydantic", "dse.core", "dse.features"]

[[tool.importlinter.contracts]]
name = "shared kernel is pure"
type = "forbidden"
source_modules = ["dse.shared_kernel"]
forbidden_modules = ["fastapi", "sqlalchemy", "redis", "httpx", "dse.core"]

[[tool.importlinter.contracts]]
name = "feature layers: presentation > infrastructure > application > domain"
type = "layers"
containers = [
  "dse.features.market_data",
  "dse.features.live_feed",
  "dse.features.analysis",
  "dse.features.scanner",
  "dse.features.identity",
  "dse.features.watchlists",
  "dse.features.company",
  "dse.features.charts",
]
layers = ["presentation", "infrastructure", "application", "domain"]
exhaustive = false

[[tool.importlinter.contracts]]
name = "domains are pure (no framework, ORM, HTTP, cache, or core)"
type = "forbidden"
source_modules = [
  "dse.features.market_data.domain",
  "dse.features.live_feed.domain",
  "dse.features.analysis.domain",  # numpy/pandas are allowed here (ADR 0004)
  "dse.features.scanner.domain",
  "dse.features.identity.domain",
  "dse.features.watchlists.domain",
  "dse.features.company.domain",
  "dse.features.charts.domain",
]
forbidden_modules = ["fastapi", "sqlalchemy", "httpx", "redis", "pydantic", "dse.core"]

[[tool.importlinter.contracts]]
name = "application layer has no infrastructure or web dependencies"
type = "forbidden"
source_modules = [
  "dse.features.market_data.application",
  "dse.features.live_feed.application",
  "dse.features.analysis.application",
  "dse.features.scanner.application",
  "dse.features.identity.application",
  "dse.features.watchlists.application",
  "dse.features.company.application",
  "dse.features.charts.application",
]
forbidden_modules = ["fastapi", "sqlalchemy", "httpx", "redis", "dse.core"]

[[tool.importlinter.contracts]]
# Features are independent; only composition roots (main, worker, cli) wire them together. When a feature
# needs another, allow exactly `<other>.application.facade` here via ignore_imports (architecture rule 3).
name = "live_feed does not depend on market_data"
type = "forbidden"
source_modules = ["dse.features.live_feed"]
forbidden_modules = ["dse.features.market_data", "dse.features.analysis", "dse.features.scanner"]
ignore_imports = ["dse.features.live_feed.tests.** -> dse.main"]  # tests may boot the whole app

[[tool.importlinter.contracts]]
name = "market_data does not depend on live_feed"
type = "forbidden"
source_modules = ["dse.features.market_data"]
forbidden_modules = ["dse.features.live_feed", "dse.features.analysis", "dse.features.scanner"]
ignore_imports = ["dse.features.market_data.tests.** -> dse.main"]

[[tool.importlinter.contracts]]
name = "analysis reaches other features only through their application facade"
type = "forbidden"
source_modules = ["dse.features.analysis"]
forbidden_modules = ["dse.features.market_data", "dse.features.live_feed"]
allow_indirect_imports = true
ignore_imports = [
  "dse.features.analysis.infrastructure.gateways -> dse.features.market_data.application.facade",
  "dse.features.analysis.infrastructure.gateways -> dse.features.live_feed.application.facade",
]

[[tool.mypy.overrides]]
module = "dse.features.analysis.tests.legacy.*"
ignore_errors = true

[[tool.importlinter.contracts]]
name = "scanner reaches other features only through their application facade"
type = "forbidden"
source_modules = ["dse.features.scanner"]
forbidden_modules = ["dse.features.market_data", "dse.features.live_feed", "dse.features.analysis"]
allow_indirect_imports = true
ignore_imports = [
  "dse.features.scanner.application.** -> dse.features.analysis.application.facade",
  "dse.features.scanner.infrastructure.gateways -> dse.features.analysis.application.facade",
  "dse.features.scanner.infrastructure.gateways -> dse.features.market_data.application.facade",
  "dse.features.scanner.infrastructure.gateways -> dse.features.live_feed.application.facade",
  "dse.features.scanner.tests.** -> dse.features.analysis.application.facade",
]

[[tool.importlinter.contracts]]
name = "analysis does not depend on scanner"
type = "forbidden"
source_modules = ["dse.features.analysis"]
forbidden_modules = ["dse.features.scanner"]

[[tool.mypy.overrides]]
module = "dse.features.scanner.tests.legacy.*"
ignore_errors = true

[[tool.importlinter.contracts]]
name = "identity is independent of every other feature"
type = "forbidden"
source_modules = ["dse.features.identity"]
forbidden_modules = [
  "dse.features.market_data",
  "dse.features.live_feed",
  "dse.features.analysis",
  "dse.features.scanner",
  "dse.features.watchlists",
]

[[tool.importlinter.contracts]]
name = "watchlists reaches other features only through their application facade"
type = "forbidden"
source_modules = ["dse.features.watchlists"]
forbidden_modules = [
  "dse.features.market_data",
  "dse.features.live_feed",
  "dse.features.analysis",
  "dse.features.scanner",
  "dse.features.identity",
]
allow_indirect_imports = true
ignore_imports = [
  "dse.features.watchlists.infrastructure.gateways -> dse.features.live_feed.application.facade",
  "dse.features.watchlists.infrastructure.gateways -> dse.features.scanner.application.facade",
]

[[tool.importlinter.contracts]]
name = "no feature depends on identity or watchlists (they sit at the top)"
type = "forbidden"
source_modules = [
  "dse.features.market_data",
  "dse.features.live_feed",
  "dse.features.analysis",
  "dse.features.scanner",
]
forbidden_modules = ["dse.features.identity", "dse.features.watchlists"]
ignore_imports = [
  "dse.features.market_data.tests.** -> dse.main",
  "dse.features.live_feed.tests.** -> dse.main",
]

[[tool.importlinter.contracts]]
name = "company reaches other features only through their application facade"
type = "forbidden"
source_modules = ["dse.features.company"]
forbidden_modules = [
  "dse.features.market_data",
  "dse.features.live_feed",
  "dse.features.analysis",
  "dse.features.scanner",
  "dse.features.identity",
  "dse.features.watchlists",
]
allow_indirect_imports = true
ignore_imports = [
  "dse.features.company.infrastructure.gateways -> dse.features.live_feed.application.facade",
  "dse.features.company.infrastructure.gateways -> dse.features.analysis.application.facade",
  "dse.features.company.infrastructure.gateways -> dse.features.market_data.application.facade",
]

[[tool.importlinter.contracts]]
name = "no other feature depends on company"
type = "forbidden"
source_modules = [
  "dse.features.market_data",
  "dse.features.live_feed",
  "dse.features.analysis",
  "dse.features.scanner",
  "dse.features.identity",
  "dse.features.watchlists",
]
forbidden_modules = ["dse.features.company"]
ignore_imports = ["dse.features.*.tests.** -> dse.main"]  # tests may boot the whole app

[[tool.importlinter.contracts]]
name = "charts reaches other features only through their application facade"
type = "forbidden"
source_modules = ["dse.features.charts"]
forbidden_modules = [
  "dse.features.market_data",
  "dse.features.live_feed",
  "dse.features.analysis",
  "dse.features.scanner",
  "dse.features.identity",
  "dse.features.watchlists",
  "dse.features.company",
]
allow_indirect_imports = true
ignore_imports = [
  "dse.features.charts.infrastructure.gateways -> dse.features.market_data.application.facade",
  "dse.features.charts.infrastructure.gateways -> dse.features.live_feed.application.facade",
]

[[tool.importlinter.contracts]]
name = "no other feature depends on charts"
type = "forbidden"
source_modules = [
  "dse.features.market_data",
  "dse.features.live_feed",
  "dse.features.analysis",
  "dse.features.scanner",
  "dse.features.identity",
  "dse.features.watchlists",
  "dse.features.company",
]
forbidden_modules = ["dse.features.charts"]
ignore_imports = ["dse.features.*.tests.** -> dse.main"]
