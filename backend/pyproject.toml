[project]
name = "dse-analyzer"
version = "0.1.0"
description = "DSE Live Analyzer — modular monolith backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8", "pytest-asyncio>=0.23", "import-linter>=2.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S", "PT", "RET", "TID"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011"]
"alembic/**" = ["N999"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["dse"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs Postgres + Redis (docker compose up -d db redis)"]

[tool.importlinter]
root_package = "dse"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core is infrastructure-only and never depends on features"
type = "forbidden"
source_modules = ["dse.core", "dse.shared_kernel"]
forbidden_modules = ["dse.features"]

[[tool.importlinter.contracts]]
name = "shared kernel is pure"
type = "forbidden"
source_modules = ["dse.shared_kernel"]
forbidden_modules = ["fastapi", "sqlalchemy", "redis", "httpx", "dse.core"]
